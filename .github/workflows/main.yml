---
name: CI

# Minimal lint-only CI.
#
# Scope is deliberately narrow: the contracts in `contracts/` are audited and
# frozen (see README "Contract formatting is frozen"), so there is no value in
# gating pushes on Solidity formatting -- and reformatting them would change
# the compiled metadata hash and invalidate the on-chain verification of every
# live deployment. Hardhat tests are also excluded because they fork mainnet
# and therefore need a funded archive RPC; run them locally with `npm test`.
#
# This replaces a previous workflow that had been failing with
# `startup_failure` on every run (it cached a non-existent
# `smart-contracts/yarn.lock`, triggered on a `main` branch that isn't the
# default, pinned Node 16 against a Node 20 toolchain, invoked yarn scripts
# that don't exist, and exported MAINNET_RPC_ENDPOINT while hardhat.config.ts
# reads MAINNET_URL).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .
